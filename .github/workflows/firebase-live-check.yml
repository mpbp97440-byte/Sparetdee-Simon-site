name: Firebase live check

on:
  push:
    branches:
      - v14-firebase-cloudflare-migration

permissions:
  contents: read

jobs:
  firebase-auth-live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run Firebase live auth probe
        run: node tests/firebase-live-auth.mjs
